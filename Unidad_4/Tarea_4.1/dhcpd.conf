# Configuración de ISC-DHCP-Server para Red Corporativa
# Archivo de destino en Debian: /etc/dhcp/dhcpd.conf

# Dominio corporativo anunciado
option domain-name "empresa.local";

# Servidor DNS que se anunciará a los clientes
option domain-name-servers 192.168.50.10;

# Tiempos de concesión (lease time) en segundos
default-lease-time 600;   # 10 minutos por defecto
max-lease-time 7200;       # 2 horas como máximo

# Servidor DHCP autoritativo para esta red local
authoritative;

# Definición de la subred corporativa 192.168.50.0/24
subnet 192.168.50.0 netmask 255.255.255.0 {
    # Rango de IPs dinámicas con exclusión implementada (192.168.50.150 a 192.168.50.160 excluidos)
    # Rango 1: 100 al 149
    range 192.168.50.100 192.168.50.149;
    # Rango 2: 161 al 200
    range 192.168.50.161 192.168.50.200;

    # Puerta de enlace predeterminada (Gateway)
    option routers 192.168.50.1;

    # Dirección de difusión (Broadcast)
    option broadcast-address 192.168.50.255;

    # Servidor NTP opcional para sincronización horaria
    # option ntp-servers 192.168.50.10;
}

# ==============================================================================
# RESERVA ESTÁTICA BASADA EN DIRECCIÓN MAC
# ==============================================================================
# Asigna siempre la misma dirección IP (192.168.50.25) a una estación específica.
# Reemplaza 00:0c:29:ab:cd:ef por la dirección MAC del adaptador VMnet1 o cliente.
host cliente-vip {
    hardware ethernet 00:0c:29:ab:cd:ef; # <-- Colocar aquí la MAC real del cliente
    fixed-address 192.168.50.25;
    option host-name "cliente-vip.empresa.local";
}

