# Virtual Host HTTPS Seguro (Puerto 443) con Cifrado SSL/TLS
# Archivo de destino en Debian: /etc/apache2/sites-available/empresa.local-ssl.conf

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName empresa.local
    ServerAlias www.empresa.local
    ServerAdmin admin@empresa.local

    # Raíz de los documentos web del sitio corporativo
    DocumentRoot /var/www/empresa.local/public_html

    # Configuración de permisos para el directorio raíz
    <Directory /var/www/empresa.local/public_html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    # ==========================================================================
    # CONFIGURACIÓN DEL MOTOR SSL/TLS
    # ==========================================================================
    SSLEngine on

    # Rutas al certificado público y la clave privada generados
    SSLCertificateFile /etc/ssl/certs/empresa.local.crt
    SSLCertificateKeyFile /etc/ssl/private/empresa.local.key

    # Protocolos seguros (TLS 1.2 y TLS 1.3 únicamente, descartando SSLv3, TLS 1.0 y 1.1)
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

    # Cifrados criptográficos de alta seguridad
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    SSLHonorCipherOrder on

    # Logs específicos para el sitio seguro
    ErrorLog ${APACHE_LOG_DIR}/empresa.local_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/empresa.local_ssl_access.log combined
</VirtualHost>
</IfModule>

