# Configuración Segura de Servidor FTP vsftpd con Enjaulamiento (Chroot Jail)
# Archivo de destino en Debian: /etc/vsftpd.conf

# Ejecutar en modo independiente para IPv4
listen=YES
listen_ipv6=NO

# ==============================================================================
# CONTROL DE ACCESO Y SEGURIDAD
# ==============================================================================
# Desactivar completamente el acceso de usuarios anónimos
anonymous_enable=NO

# Permitir inicio de sesión a usuarios locales del sistema Linux
local_enable=YES

# Permitir escritura (subida, modificación y borrado de archivos)
write_enable=YES

# Máscara de permisos por defecto para archivos creados (022 = rw-r--r--)
local_umask=022

# Mensaje de bienvenida corporativo
ftpd_banner=Bienvenido al Servidor FTP Seguro de Empresa Corporativa.

# ==============================================================================
# ENJAULAMIENTO DE USUARIOS (CHROOT JAIL)
# ==============================================================================
# Encierra a todos los usuarios locales dentro de su directorio asignado.
# Esto impide que el usuario navegue hacia /etc, /var, /root o cualquier carpeta del sistema.
chroot_local_user=YES

# Permite que el directorio jaula sea escribible sin violar las políticas de seguridad de vsftpd
allow_writeable_chroot=YES
secure_chroot_dir=/var/run/vsftpd/empty

# Integración con el sistema de autenticación PAM de Debian
pam_service_name=vsftpd

# ==============================================================================
# REGISTRO DE ACTIVIDAD (LOGS)
# ==============================================================================
xferlog_enable=YES
xferlog_file=/var/log/vsftpd.log
xferlog_std_format=YES

# Tiempo de espera por inactividad (en segundos)
idle_session_timeout=600
data_connection_timeout=120

# ==============================================================================
# RANGO DE PUERTOS PASIVOS (Para compatibilidad con Firewalls y NAT)
# ==============================================================================
pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40100

# ==============================================================================
# SEGURIDAD CRIPTOGRÁFICA (FTPS - TLS/SSL)
# ==============================================================================
# Habilitar soporte TLS para transferencias cifradas
ssl_enable=YES
allow_anon_ssl=NO
force_local_data_ssl=NO
force_local_logins_ssl=NO
ssl_tlsv1=YES
ssl_sslv2=NO
ssl_sslv3=NO
rsa_cert_file=/etc/ssl/certs/empresa.local.crt
rsa_private_key_file=/etc/ssl/private/empresa.local.key

