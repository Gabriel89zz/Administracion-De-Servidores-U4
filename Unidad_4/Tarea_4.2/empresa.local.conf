# Virtual Host HTTP (Puerto 80) para Redirección Automática a HTTPS
# Archivo de destino en Debian: /etc/apache2/sites-available/empresa.local.conf

<VirtualHost *:80>
    ServerName empresa.local
    ServerAlias www.empresa.local
    ServerAdmin admin@empresa.local

    # Redirigir todas las peticiones entrantes de HTTP a HTTPS de forma permanente (301)
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    # Registro de eventos y accesos
    ErrorLog ${APACHE_LOG_DIR}/empresa.local_error.log
    CustomLog ${APACHE_LOG_DIR}/empresa.local_access.log combined
</VirtualHost>

