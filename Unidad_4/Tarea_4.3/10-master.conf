# Configuración del Socket de Autenticación Dovecot para Postfix
# Archivo de referencia para editar en Debian: /etc/dovecot/conf.d/10-master.conf

# Buscar la sección service auth y asegurar que contenga:
#
# service auth {
#   unix_listener /var/spool/postfix/private/auth {
#     mode = 0660
#     user = postfix
#     group = postfix
#   }
# }

service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }

  unix_listener auth-userdb {
    mode = 0600
    user = vmail
  }
}

