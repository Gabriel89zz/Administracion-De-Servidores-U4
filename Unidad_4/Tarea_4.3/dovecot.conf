dovecot_config_version = 2.3.0

# Configuración Principal de Dovecot MDA
# Archivo de destino en Debian: /etc/dovecot/dovecot.conf

# Protocolos habilitados: IMAP (recuperación de correos) y POP3
protocols = imap pop3

# Escuchar en todas las interfaces de red
listen = *, ::

# Ubicación de los archivos de configuración modulares
!include conf.d/*.conf
!include_try local.conf

