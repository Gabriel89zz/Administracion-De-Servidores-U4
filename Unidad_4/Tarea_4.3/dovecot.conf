dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

# ==============================================================================
# Configuración Moderna para Dovecot 2.4 (Debian 12/13)
# ==============================================================================
protocols = imap pop3
listen = *, ::

# Mecanismos de autenticación
auth_mechanisms = plain login

# Base de datos de usuarios y contraseñas del sistema Linux (PAM + passwd)
userdb passwd {
  driver = passwd
}

passdb pam {
  driver = pam
}

# Formato de almacenamiento Maildir en el directorio del usuario
mail_driver = maildir
mail_path = ~/Maildir

# Seguridad Criptográfica SSL/TLS (Sintaxis Dovecot 2.4)
ssl = yes
ssl_server_cert_file = /etc/ssl/certs/empresa.local.crt
ssl_server_key_file = /etc/ssl/private/empresa.local.key

# Socket de autenticación SASL para Postfix
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}


