# Configuración de Cifrado SSL/TLS para Dovecot IMAP/POP3
# Archivo de destino en Debian: /etc/dovecot/conf.d/10-ssl.conf

# Habilitar soporte SSL/TLS
ssl = yes

# Rutas hacia el certificado y la clave privada generados para el dominio
ssl_cert = </etc/ssl/certs/empresa.local.crt
ssl_key = </etc/ssl/private/empresa.local.key

# Protocolos seguros permitidos
ssl_min_protocol = TLSv1.2
ssl_cipher_list = ALL:!kRSA:!SRP:!kDHd:!DSS:!aNULL:!eNULL:!EXPORT:!DES:!3DES:!MD5:!PSK:!RC4:!ADH:!LOW@STRENGTH
ssl_prefer_server_ciphers = yes

