# Configuración de Autenticación Dovecot
# Archivo de destino en Debian: /etc/dovecot/conf.d/10-auth.conf

# Mecanismos de autenticación soportados (PLAIN y LOGIN requeridos por clientes como Thunderbird)
auth_mechanisms = plain login

# Utilizar la base de datos de contraseñas de Linux (/etc/passwd y /etc/shadow)
!include auth-system.conf.ext

